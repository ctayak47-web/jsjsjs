<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bots · status</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1100px 550px at 20% -10%, rgba(124,92,255,0.18), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(52,211,153,0.10), transparent 55%),
      #0b0c10;
    color: #e7e9ee;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }
  .wrap { width: 100%; max-width: 460px; }
  h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 6px; }
  .sub { color: #8b90a0; font-size: 13px; margin-bottom: 22px; }
  .card {
    background: linear-gradient(180deg, #14151b 0%, #101116 100%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .name { font-weight: 600; font-size: 14px; }
  .desc { color: #8b90a0; font-size: 12px; margin-top: 3px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 4px #34d39922; }
  .foot { margin-top: 18px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #565b6b; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>сервис активен</h1>
    <div class="sub">этот сервис держит telegram-ботов онлайн 24/7</div>

    <div class="card">
      <div>
        <div class="name">сингулярное ядро + GRAM</div>
        <div class="desc">idle-игра и экономика внутри одного бота</div>
      </div>
      <div class="dot"></div>
    </div>

    <div class="card">
      <div>
        <div class="name">анализ регистрации</div>
        <div class="desc">/reg1, оценка даты по id</div>
      </div>
      <div class="dot"></div>
    </div>

    <div class="foot">GET /health · GET /ping — для UptimeRobot</div>
  </div>
</body>
</html>
